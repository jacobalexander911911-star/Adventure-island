
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survival Island 6.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#153b48;color:white;font-family:Arial}
canvas{display:block}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#09232bdc,#09232bf5)}
.panel{width:min(420px,92vw);padding:25px;background:#173b40;border:2px solid #79c98b;border-radius:18px;text-align:center}
h1{color:#91e9a4}
input,button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:9px;font-size:15px}
input{background:#eef8ed;color:#173b40}
button{background:#4caf70;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.secondary{background:#426b80}
#message{font-size:13px;color:#ffd58c;min-height:20px;overflow-wrap:anywhere}
#hud,#status{position:fixed;z-index:4;background:#102d32e8;padding:12px;border-radius:10px}
#hud{top:10px;left:10px;line-height:1.7}
#status{top:10px;right:10px;font-size:12px}
#help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:4;background:#102d32dd;padding:10px;border-radius:10px;font-size:12px;text-align:center;white-space:nowrap}
#toast{position:fixed;z-index:15;top:65px;left:50%;transform:translateX(-50%);background:#173b40;padding:12px 18px;border-radius:10px;display:none}
#mobile,#actions{display:none;position:fixed;z-index:5;bottom:65px}
#mobile{left:8px}
#actions{right:8px}
#mobile button,#actions button{width:55px;height:46px;padding:4px;margin:2px}
@media(max-width:700px){
 #mobile,#actions{display:block}
 #hud{font-size:12px}
 #help{font-size:10px;white-space:normal;width:85%;text-align:center}
}
</style>
</head>
<body>

<div id="menu">
 <div class="panel">
  <h1>🏝️ SURVIVAL ISLAND 6.0</h1>
  <b>STABLE ONLINE MULTIPLAYER</b>
  <p id="startup">Connecting to Firebase...</p>
  <input id="playerName" maxlength="16" value="Survivor" placeholder="Player name">
  <button id="createBtn" disabled>CREATE ONLINE WORLD</button>
  <hr>
  <input id="roomInput" maxlength="8" placeholder="Enter room code">
  <button id="joinBtn" class="secondary" disabled>JOIN FRIEND'S WORLD</button>
  <div id="message">Please wait while the game connects.</div>
 </div>
</div>

<div id="hud">
 <b>🏝️ SURVIVAL ISLAND</b><br>
 ❤️ Health: <span id="health">100</span><br>
 🍗 Hunger: <span id="hunger">100</span><br>
 🪵 Wood: <span id="wood">0</span><br>
 🪨 Stone: <span id="stone">0</span><br>
 👥 Players: <span id="players">0</span>
</div>
<div id="status">🟠 Starting...</div>
<div id="toast"></div>
<div id="help">WASD Move · E Collect · B Build · Space Attack · V Boat</div>

<div id="mobile">
 <div style="text-align:center"><button data-key="w">▲</button></div>
 <div><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div>
</div>
<div id="actions">
 <button onclick="collectNearby()">COLLECT</button>
 <button onclick="buildWall()">BUILD</button>
 <button onclick="attack()">ATTACK</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

import {initializeApp} from
'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';

import {
 getDatabase,ref,set,get,update,onValue,onDisconnect,
 push,runTransaction
} from
'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

import {
 getAuth,signInAnonymously
} from
'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

/* FIREBASE */
const firebaseConfig={
 apiKey:"AIzaSyAxPBtGcURK1e7Vsb5REARfewFE4DNoYpc",
 authDomain:"adventure-island-874fc.firebaseapp.com",
 databaseURL:"https://adventure-island-874fc-default-rtdb.firebaseio.com",
 projectId:"adventure-island-874fc",
 storageBucket:"adventure-island-874fc.firebasestorage.app",
 messagingSenderId:"1017449600915",
 appId:"1:1017449600915:web:dd97c64f5cd44cdf16fa66",
 measurementId:"G-K851DM0X7K"
};

const $=id=>document.getElementById(id);
const say=t=>$("message").textContent=t;

function toast(t){
 $("toast").textContent=t;
 $("toast").style.display="block";
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>$("toast").style.display="none",2200);
}

let app,db,auth,uid="",room="",name="Survivor";
let ready=false,playing=false;
let health=100,hunger=100;
const bag={wood:0,stone:0};
const keys={};
const remotes={};
const resourceMeshes={};
const structureMeshes={};
let lastSend=0,lastHunger=0;

const initialResources={};
for(let i=0;i<16;i++){
 const a=i*2.1,r=7+(i%5)*4;
 initialResources["wood"+i]={
  type:"wood",x:Math.cos(a)*r,z:Math.sin(a)*r,collected:false
 };
}
for(let i=0;i<12;i++){
 const a=i*2.3+.4,r=8+(i%4)*5;
 initialResources["stone"+i]={
  type:"stone",x:Math.cos(a)*r,z:Math.sin(a)*r,collected:false
 };
}

/* STARTUP AND ERROR DISPLAY */
window.addEventListener("error",e=>{
 say("Game error: "+e.message);
 console.error(e.error||e.message);
});
window.addEventListener("unhandledrejection",e=>{
 say("Connection error: "+(e.reason?.message||e.reason));
 console.error(e.reason);
});

try{
 app=initializeApp(firebaseConfig);
 db=getDatabase(app);
 auth=getAuth(app);

 const credential=await signInAnonymously(auth);
 uid=credential.user.uid;

 ready=true;
 $("startup").textContent="🟢 Connected! Ready to play.";
 $("status").textContent="🟢 Firebase connected";
 $("createBtn").disabled=false;
 $("joinBtn").disabled=false;
 say("Create a world or enter a friend's room code.");
}catch(error){
 console.error(error);
 $("startup").textContent="Could not connect to Firebase.";
 $("status").textContent="🔴 Connection failed";
 say(error.code+": "+error.message+
  " Check Anonymous Authentication and authorised domains.");
}

/* THREE.JS */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83c9e8);
scene.fog=new THREE.Fog(0x83c9e8,55,150);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);
camera.position.set(0,9,13);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x527348,1.8));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-25,45,20);
sun.castShadow=true;
scene.add(sun);

function material(color){
 return new THREE.MeshStandardMaterial({color,roughness:1});
}
function cube(x,y,z,sx,sy,sz,color,parent=scene){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material(color));
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}
function ico(x,y,z,r,color,parent=scene){
 const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),material(color));
 m.position.set(x,y,z);
 m.castShadow=true;
 parent.add(m);
 return m;
}

/* ISLANDS AND OCEAN */
const ocean=new THREE.Mesh(
 new THREE.CircleGeometry(180,64),material(0x168cb6)
);
ocean.rotation.x=-Math.PI/2;
ocean.position.y=-1.3;
scene.add(ocean);

function island(x,z,r){
 const base=new THREE.Mesh(
  new THREE.CylinderGeometry(r,r*.85,2,16),material(0xc3a16b)
 );
 base.position.set(x,-.9,z);
 scene.add(base);
 const top=new THREE.Mesh(
  new THREE.CylinderGeometry(r,r,.25,16),material(0x73b85d)
 );
 top.position.set(x,.15,z);
 scene.add(top);
}
island(0,0,30);
island(58,-28,17);
island(-65,-38,19);
island(35,75,15);

function tree(x,z){
 const g=new THREE.Group();
 cube(0,1,0,.45,2,.45,0x80512e,g);
 const leaves=ico(0,2.5,0,1.5,0x28783a,g);
 leaves.scale.y=.85;
 g.position.set(x,0,z);
 scene.add(g);
}
for(let i=0;i<32;i++){
 const a=i*2.399,r=8+(i%6)*3;
 tree(Math.cos(a)*r,Math.sin(a)*r);
}

/* CHARACTERS */
function character(color){
 const g=new THREE.Group();
 const body=cube(0,1,0,.8,1.25,.5,color,g);
 ico(0,1.9,0,.42,0xf0c49a,g);
 cube(-.48,.55,0,.22,.85,.24,0x334b55,g);
 cube(.48,.55,0,.22,.85,.24,0x334b55,g);
 return {group:g,body};
}
const hero=character(0x288bd0);
scene.add(hero.group);

/* RESOURCES */
function showResource(id,d){
 if(resourceMeshes[id]){
  resourceMeshes[id].visible=!d.collected;
  return;
 }
 const g=new THREE.Group();
 if(d.type==="wood"){
  cube(0,.55,0,.65,1.1,.65,0x80512e,g);
  ico(0,1.3,0,.7,0x347e39,g);
 }else{
  ico(0,.55,0,.75,0x828b91,g);
 }
 g.position.set(d.x,0,d.z);
 g.visible=!d.collected;
 scene.add(g);
 resourceMeshes[id]=g;
}
function showResources(data){
 for(const [id,d] of Object.entries(data||{}))showResource(id,d);
}

/* ANIMALS AND ENEMIES */
const enemies=[];
function creature(x,z,color,size){
 const g=new THREE.Group();
 cube(0,.5,0,size,size*.8,size*1.4,color,g);
 ico(0,1,0,size*.5,0x9c795a,g);
 g.position.set(x,0,z);
 scene.add(g);
 return g;
}
for(let i=0;i<7;i++){
 const a=i*2.4,r=8+(i%4)*4;
 creature(Math.cos(a)*r,Math.sin(a)*r,0xb8a16d,.65);
}
for(let i=0;i<5;i++){
 const a=i*2.7,r=12+(i%3)*5;
 const e=creature(Math.cos(a)*r,Math.sin(a)*r,0x8b3434,.8);
 e.userData.hp=3;
 e.userData.cooldown=0;
 enemies.push(e);
}

/* BOAT */
const boat=new THREE.Group();
cube(0,.1,0,2.4,.45,4,0x8b572e,boat);
cube(0,.7,0,.15,1.2,.15,0xead8a4,boat);
boat.position.set(0,0,-34);
scene.add(boat);
let inBoat=false;

window.toggleBoat=()=>{
 if(!playing)return;
 const p=hero.group.position;
 if(!inBoat){
  if(Math.hypot(p.x-boat.position.x,p.z-boat.position.z)>5)
   return toast("Move close to the boat first.");
  inBoat=true;
  toast("You boarded the boat.");
 }else{
  inBoat=false;
  p.set(boat.position.x,0,boat.position.z+3);
  toast("You left the boat.");
 }
};

/* CAVE */
const cave=new THREE.Group();
cube(0,-.1,0,18,.5,18,0x34383d,cave);
for(let i=0;i<12;i++){
 const a=i*2.4;
 ico(Math.cos(a)*8,1,Math.sin(a)*8,1.6,0x44484d,cave);
}
for(let i=0;i<6;i++)ico(-5+i*2,.7,-3+(i%2)*3,.55,0x4cc9e9,cave);
cave.visible=false;
scene.add(cave);
ico(-8,.7,9,1.1,0x34383d).scale.set(1.4,1.2,.7);
let inCave=false;

window.toggleCave=()=>{
 if(!playing)return;
 const p=hero.group.position;
 if(!inCave){
  if(Math.hypot(p.x+8,p.z-9)>4)return toast("Find the cave entrance.");
  inCave=true;cave.visible=true;p.set(0,0,0);
 }else{
  inCave=false;cave.visible=false;p.set(-8,0,12);
 }
};

/* SHARED STRUCTURES */
function showStructures(data){
 for(const [id,d] of Object.entries(data||{})){
  if(structureMeshes[id])continue;
  let m;
  if(d.type==="wall")m=cube(d.x,.9,d.z,2,1.8,.35,0x98663d);
  else if(d.type==="floor")m=cube(d.x,.1,d.z,3,.2,3,0x98663d);
  else m=cube(d.x,.5,d.z,1,1,1,0xe66c24);
  m.rotation.y=d.rotation||0;
  structureMeshes[id]=m;
 }
}
window.buildWall=async()=>{
 if(!playing)return toast("Join a world first.");
 if(bag.wood<5)return toast("You need 5 wood.");
 const p=hero.group.position;
 const node=push(ref(db,"rooms/"+room+"/structures"));
 try{
  await set(node,{
   type:"wall",
   x:p.x+Math.sin(hero.group.rotation.y)*2,
   z:p.z+Math.cos(hero.group.rotation.y)*2,
   rotation:hero.group.rotation.y,
   owner:uid
  });
  bag.wood-=5;
  updateHUD();
  toast("Wall built!");
 }catch(e){toast("Build failed: "+e.message);}
};

/* HUD */
function updateHUD(){
 $("health").textContent=health;
 $("hunger").textContent=hunger;
 $("wood").textContent=bag.wood;
 $("stone").textContent=bag.stone;
}

/* COLLECT */
window.collectNearby=async()=>{
 if(!playing)return;
 const p=hero.group.position;
 let closest=null,best=3.5;

 for(const [id,d] of Object.entries(initialResources)){
  const mesh=resourceMeshes[id];
  if(!mesh||!mesh.visible)continue;
  const distance=Math.hypot(p.x-d.x,p.z-d.z);
  if(distance<best){best=distance;closest=id;}
 }
 if(!closest)return toast("No resources nearby.");

 try{
  const r=ref(db,"rooms/"+room+"/resources/"+closest);
  const result=await runTransaction(r,current=>{
   if(!current||current.collected)return;
   return {...current,collected:true};
  });
  if(!result.committed)return toast("Someone collected it first.");
  const type=result.snapshot.val().type;
  bag[type]++;
  updateHUD();
  toast("Collected "+type+"!");
 }catch(e){toast("Collection error: "+e.message);}
};

/* ATTACK */
window.attack=()=>{
 if(!playing)return;
 hero.body.rotation.x=-.8;
 setTimeout(()=>hero.body.rotation.x=0,250);
 const p=hero.group.position;
 for(const e of enemies){
  if(!e.visible)continue;
  if(Math.hypot(p.x-e.position.x,p.z-e.position.z)<3){
   e.userData.hp--;
   if(e.userData.hp<=0){
    e.visible=false;
    toast("Enemy defeated!");
   }else toast("Enemy hit!");
   return;
  }
 }
 toast("You swung your weapon!");
};

/* REMOTE PLAYERS */
function updatePlayers(data){
 $("players").textContent=Object.keys(data).length;
 for(const [id,d] of Object.entries(data)){
  if(id===uid)continue;
  if(!remotes[id]){
   remotes[id]=character(0xe6a43c);
   scene.add(remotes[id].group);
  }
  remotes[id].group.position.set(d.x||0,0,d.z||0);
  remotes[id].group.rotation.y=d.rotation||0;
 }
 for(const id of Object.keys(remotes)){
  if(!data[id]){
   scene.remove(remotes[id].group);
   delete remotes[id];
  }
 }
}

/* ONLINE ROOM FLOW */
function makeCode(){
 return Math.random().toString(36).slice(2,8).toUpperCase();
}

async function enterRoom(){
 const playerRef=ref(db,"rooms/"+room+"/players/"+uid);
 await set(playerRef,{
  name,
  x:0,z:0,rotation:0,
  health:100,hunger:100,
  joined:Date.now()
 });
 await onDisconnect(playerRef).remove();

 playing=true;
 $("menu").style.display="none";
 $("status").textContent="🟢 ONLINE · "+room;

 onValue(ref(db,"rooms/"+room+"/players"),s=>updatePlayers(s.val()||{}));
 onValue(ref(db,"rooms/"+room+"/resources"),s=>showResources(s.val()||{}));
 onValue(ref(db,"rooms/"+room+"/structures"),s=>showStructures(s.val()||{}));

 const snapshot=await get(ref(db,"rooms/"+room));
 const data=snapshot.val()||{};
 showResources(data.resources||{});
 showStructures(data.structures||{});
 toast("Joined room "+room);
}

async function createRoom(){
 if(!ready)return;
 $("createBtn").disabled=true;
 name=$("playerName").value.trim()||"Survivor";
 try{
  let code,roomRef,available=false;
  for(let i=0;i<8;i++){
   code=makeCode();
   roomRef=ref(db,"rooms/"+code);
   const s=await get(roomRef);
   if(!s.exists()){available=true;break;}
  }
  if(!available)throw Error("Could not create a room. Try again.");

  room=code;
  await set(roomRef,{owner:uid,created:Date.now()});
  await set(ref(db,"rooms/"+room+"/resources"),initialResources);
  await set(ref(db,"rooms/"+room+"/structures"),{});
  await enterRoom();
 }catch(e){
  console.error(e);
  say("Create failed: "+e.message);
  $("createBtn").disabled=false;
 }
}

async function joinRoom(){
 if(!ready)return;
 $("joinBtn").disabled=true;
 name=$("playerName").value.trim()||"Survivor";
 room=$("roomInput").value.trim().toUpperCase();
 try{
  if(!room)throw Error("Enter a room code.");
  const s=await get(ref(db,"rooms/"+room));
  if(!s.exists())throw Error("That room does not exist.");
  await enterRoom();
 }catch(e){
  console.error(e);
  say("Join failed: "+e.message);
  $("joinBtn").disabled=false;
 }
}

/* MOVEMENT */
function move(dt){
 let dx=0,dz=0;
 if(keys.w||keys.arrowup)dz--;
 if(keys.s||keys.arrowdown)dz++;
 if(keys.a||keys.arrowleft)dx--;
 if(keys.d||keys.arrowright)dx++;

 const p=hero.group.position;

 if(inBoat){
  boat.position.x+=dx*10*dt;
  boat.position.z+=dz*10*dt;
  p.x=boat.position.x;p.z=boat.position.z;
  return;
 }

 if(dx||dz){
  const length=Math.hypot(dx,dz);
  dx/=length;dz/=length;
  const speed=inCave?4:6;
  p.x+=dx*speed*dt;
  p.z+=dz*speed*dt;
  hero.group.rotation.y=Math.atan2(dx,dz);
 }
}

function sendPosition(){
 if(!playing)return;
 const p=hero.group.position;
 update(ref(db,"rooms/"+room+"/players/"+uid),{
  x:p.x,z:p.z,rotation:hero.group.rotation.y,
  health,hunger
 }).catch(e=>console.error("Position update failed:",e));
}

/* ENEMY AI */
function updateEnemies(dt){
 if(!playing||inCave)return;
 const p=hero.group.position;
 for(const e of enemies){
  if(!e.visible)continue;
  const dx=p.x-e.position.x,dz=p.z-e.position.z;
  const distance=Math.hypot(dx,dz);
  if(distance<12&&distance>1.5){
   e.position.x+=dx/distance*dt*2;
   e.position.z+=dz/distance*dt*2;
  }
  if(distance<1.8){
   e.userData.cooldown+=dt;
   if(e.userData.cooldown>2){
    e.userData.cooldown=0;
    health=Math.max(0,health-5);
    updateHUD();
    toast("An enemy attacked you!");
   }
  }
 }
}

/* INPUT */
window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;
 if(e.repeat)return;
 if(k==="e")collectNearby();
 if(k==="b")buildWall();
 if(k==="v")toggleBoat();
 if(k==="c")toggleCave();
 if(e.code==="Space"){e.preventDefault();attack();}
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

document.querySelectorAll("[data-key]").forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true;});
 ["pointerup","pointerleave","pointercancel"].forEach(event=>{
  b.addEventListener(event,()=>keys[k]=false);
 });
});

/* DAY AND NIGHT */
let day=0;
function lighting(dt){
 day+=dt*.035;
 const brightness=.3+(Math.sin(day)+1)*.35;
 sun.intensity=.4+brightness*2;
 scene.background.setHSL(.55,.45,.2+brightness*.3);
}

/* MAIN LOOP */
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 if(playing){
  move(dt);
  updateEnemies(dt);
  const p=hero.group.position;
  camera.position.lerp(new THREE.Vector3(p.x,p.y+8,p.z+12),.09);
  camera.lookAt(p.x,p.y+.5,p.z);

  if(performance.now()-lastSend>150){
   lastSend=performance.now();
   sendPosition();
  }
  if(performance.now()-lastHunger>12000){
   lastHunger=performance.now();
   hunger=Math.max(0,hunger-1);
   if(hunger===0)health=Math.max(0,health-1);
   updateHUD();
  }
 }

 lighting(dt);
 renderer.render(scene,camera);
}
animate();

/* BUTTONS */
$("createBtn").onclick=createRoom;
$("joinBtn").onclick=joinRoom;

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
updateHUD();
</script>
</body>
</html>
